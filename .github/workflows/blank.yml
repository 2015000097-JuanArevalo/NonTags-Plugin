name: Build PapuCraftNametags

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: PapuCraftNametags-source/pom.xml

      - name: Build with Maven
        working-directory: PapuCraftNametags-source
        run: mvn -B clean package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: PapuCraftNametags-jar
          path: PapuCraftNametags-source/target/PapuCraftNametags-*.jar
          if-no-files-found: error
