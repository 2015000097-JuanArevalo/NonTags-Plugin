name: PapuCraftNametags
version: '1.0.0'
main: gt.papucraft.nametags.PapuCraftNametags
api-version: '26.2'
author: PapuCraft Gamma
description: Visibilidad de nametags por clan y preferencia individual para PapuCraft Gamma.
depend:
  - TAB
  - PlaceholderAPI
commands:
  nametag:
    description: Configura la visibilidad pública de tu nametag.
    usage: /nametag <on|off|toggle|status|reload>
permissions:
  papucraft.nametag.use:
    description: Permite controlar la visibilidad pública del nametag.
    default: true
  papucraft.nametag.admin:
    description: Permite recargar PapuCraftNametags.
    default: op
