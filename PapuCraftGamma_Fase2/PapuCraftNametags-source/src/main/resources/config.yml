# Placeholder que devuelve el nombre del clan del jugador.
# Con ApexClan 0.5.x usa este placeholder.
clan-placeholder: "%apex_clan_name%"

# Placeholder booleano opcional. ApexClan devuelve true/false.
# Déjalo vacío si algún día usas un plugin de clanes que no tenga este dato.
has-clan-placeholder: "%apex_has_clan%"

# Respuestas que se interpretan como "sin clan".
no-clan-values:
  - ""
  - "none"
  - "null"
  - "sin clan"
  - "no clan"

# false = por defecto un jugador SIN ser compañero de clan NO ve tu nametag.
# true = por defecto todos lo ven hasta que uses /nametag off.
default-public: false

# Cada cuántos ticks se vuelve a comprobar la relación target/viewer.
# 40 ticks = aprox. 2 segundos.
refresh-ticks: 40

messages:
  prefix: "&8[&6PapuCraft&8] &r"
  enabled: "&aTu nametag ahora es público para jugadores externos a tu clan."
  disabled: "&eTu nametag ahora está oculto para jugadores externos a tu clan."
  status-on: "&7Visibilidad pública: &aACTIVADA&7. Los miembros de tu clan siempre pueden verte."
  status-off: "&7Visibilidad pública: &cDESACTIVADA&7. Los miembros de tu clan siempre pueden verte."
  no-permission: "&cNo tienes permiso para usar este comando."
  player-only: "&cEste subcomando solo puede usarse dentro del juego."
  reloaded: "&aPapuCraftNametags recargado."
  usage: "&7Usa: &e/nametag on&7, &e/nametag off&7, &e/nametag toggle&7 o &e/nametag status&7."
